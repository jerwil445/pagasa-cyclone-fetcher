name: Archive official PAGASA cyclone bulletins

on:
  workflow_dispatch:
  schedule:
    # UTC: every five minutes at :02, :07, ... :57, avoiding the exact hour.
    # Requested cadence only: GitHub may delay or drop scheduled events.
    - cron: '2-59/5 * * * *'

permissions:
  contents: read

concurrency:
  group: pagasa-cyclone-archive
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fetch-only dependency
        run: python -m pip install 'requests>=2.32.4,<3'
      - name: Validate repository secrets
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_SECRET_KEY" || { echo 'Configure the required Supabase repository secrets.'; exit 1; }
      - name: Fetch and archive official source
        run: python -B -m services.cyclone_cloud_job
